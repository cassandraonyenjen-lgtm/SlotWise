# Local Postgres for development: `pnpm db:up && pnpm db:migrate`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slotwise
    ports:
      - "5432:5432"
    volumes:
      - slotwise-db:/var/lib/postgresql/data
volumes:
  slotwise-db:
